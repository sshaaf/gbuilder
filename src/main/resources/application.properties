quarkus.application.name=ambitious-graph
quarkus.banner.enabled=false

# CLI-only — no HTTP server
quarkus.http.host-enabled=false

# Embedded graph store (auto-created under <codebase>/.gbuilder/graph.db)
gbuilder.graph.store-path=.gbuilder/graph.db

# Default parser backend when not specified on CLI: jparser | treesitter
gbuilder.parser.backend=jparser

# LangChain4j (embeddings only)
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:sk-placeholder}
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
%dev.quarkus.langchain4j.openai.enable-integration=false

# Logging
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.log.level=WARN
quarkus.log.category."com.ambitious".level=INFO

# Embeddings (opt-in)
ambitious.embedding.enabled=${AMBITIOUS_EMBEDDING_ENABLED:false}
ambitious.embedding.batch-size=50

# Analyzer rules
# ambitious.analyzer.rules-dir=/path/to/custom/rules

%test.gbuilder.graph.store-path=target/test-graph.db
%test.quarkus.langchain4j.openai.enable-integration=false
