quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."dev.shaaf.gbuilder".level=INFO

gbuilder.graph.store-path=target/test-graph.db

quarkus.langchain4j.openai.api-key=sk-placeholder
%test.quarkus.langchain4j.openai.enable-integration=false

gbuilder.embedding.enabled=false

# Tree-sitter is not thread-safe; keep parse sequential in tests.
gbuilder.parse.parallel-threshold=9999
