# Build, test, and publish gbuilder artifacts (uber-jar + native per OS).
# Action versions (2026-06): checkout@v6, setup-java@v5, upload-artifact@v7,
# graalvm/setup-graalvm@v1, msvc-dev-cmd@v1

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  MAVEN_ARGS: >-
    -B
    --no-transfer-progress
    -Dmaven.compiler.release=21
  TREE_SITTER4J_REPO: https://github.com/andreaTP/tree-sitter4j.git

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install tree-sitter4j
        run: |
          git clone --depth 1 "${TREE_SITTER4J_REPO}" "${RUNNER_TEMP}/tree-sitter4j"
          mvn -B -f "${RUNNER_TEMP}/tree-sitter4j/pom.xml" install -DskipTests

      - name: Run tests
        run: mvn verify ${{ env.MAVEN_ARGS }}

      - name: Publish parser comparison to job summary
        if: always()
        run: |
          report=docs/parser-comparison/report.md
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Parser comparison report not found at $report" >> "$GITHUB_STEP_SUMMARY"
          fi

  uberjar:
    name: Uber-jar
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install tree-sitter4j
        run: |
          git clone --depth 1 "${TREE_SITTER4J_REPO}" "${RUNNER_TEMP}/tree-sitter4j"
          mvn -B -f "${RUNNER_TEMP}/tree-sitter4j/pom.xml" install -DskipTests

      - name: Build uber-jar
        run: >-
          mvn package ${{ env.MAVEN_ARGS }}
          -DskipTests
          -Dquarkus.package.jar.type=uber-jar

      - name: Upload uber-jar
        uses: actions/upload-artifact@v7
        with:
          name: gbuilder-uberjar
          path: target/gbuilder-*-runner.jar
          if-no-files-found: error
          retention-days: 14

  graph-outputs:
    name: Graph outputs (sample)
    needs: uberjar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install tree-sitter4j
        run: |
          git clone --depth 1 "${TREE_SITTER4J_REPO}" "${RUNNER_TEMP}/tree-sitter4j"
          mvn -B -f "${RUNNER_TEMP}/tree-sitter4j/pom.xml" install -DskipTests

      - name: Download uber-jar
        uses: actions/download-artifact@v6
        with:
          name: gbuilder-uberjar
          path: target

      - name: Prepare sample codebase
        run: |
          FIXTURE="${RUNNER_TEMP}/coolstore-mini"
          cp -R src/test/resources/parser-benchmark/coolstore-mini "${FIXTURE}"
          echo "FIXTURE=${FIXTURE}" >> "${GITHUB_ENV}"

      - name: Build graph and zip outputs (JavaParser)
        run: |
          JAR=$(ls target/gbuilder-*-runner.jar | head -1)
          java -jar "${JAR}" -p "${FIXTURE}" --parser-backend jparser
          mkdir -p target/graph-artifacts
          test -f "${FIXTURE}/.gbuilder/graph.db"
          test -f "${FIXTURE}/.gbuilder/GRAPH_REPORT.md"
          test -f "${FIXTURE}/.gbuilder/graph.json"
          test -f "${FIXTURE}/.gbuilder/graph.html"
          test -f "${FIXTURE}/.gbuilder/manifest.json"
          (cd "${FIXTURE}/.gbuilder" && zip -r "${GITHUB_WORKSPACE}/target/graph-artifacts/gbuilder-graph-jparser.zip" .)

      - name: Build graph and zip outputs (Tree-sitter)
        run: |
          rm -rf "${FIXTURE}/.gbuilder"
          JAR=$(ls target/gbuilder-*-runner.jar | head -1)
          java -Dgbuilder.parse.parallel-threshold=9999 -jar "${JAR}" -p "${FIXTURE}" --parser-backend treesitter
          test -f "${FIXTURE}/.gbuilder/graph.db"
          (cd "${FIXTURE}/.gbuilder" && zip -r "${GITHUB_WORKSPACE}/target/graph-artifacts/gbuilder-graph-treesitter.zip" .)

      - name: Upload graph output archives
        uses: actions/upload-artifact@v7
        with:
          name: gbuilder-graph-outputs
          path: target/graph-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Note graph artifacts in job summary
        run: |
          {
            echo "## Graph output archives"
            echo ""
            echo "Sample codebase: \`coolstore-mini\` (bundled test fixture)."
            echo ""
            echo "| Archive | Parser | Contents |"
            echo "|---------|--------|----------|"
            echo "| \`gbuilder-graph-jparser.zip\` | JavaParser | graph.db, GRAPH_REPORT.md, graph.json, graph.html, manifest.json |"
            echo "| \`gbuilder-graph-treesitter.zip\` | Tree-sitter | same |"
            echo ""
            echo "Download **gbuilder-graph-outputs** from the Artifacts section of this workflow run."
          } >> "${GITHUB_STEP_SUMMARY}"

  native:
    name: Native (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: ${{ env.JAVA_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          set-java-home: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install tree-sitter4j
        shell: bash
        run: |
          git clone --depth 1 "${TREE_SITTER4J_REPO}" "${RUNNER_TEMP}/tree-sitter4j"
          mvn -B -f "${RUNNER_TEMP}/tree-sitter4j/pom.xml" install -DskipTests

      - name: Build native executable (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MAVEN_OPTS: -Xmx4g
        run: >-
          mvn package ${{ env.MAVEN_ARGS }}
          -Dnative
          -DskipTests
          -DskipITs

      - name: Build native executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MAVEN_OPTS: -Xmx4g
        run: >-
          mvn package ${{ env.MAVEN_ARGS }}
          -Dnative
          -DskipTests
          -DskipITs

      - name: Stage native binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p target/dist
          cp target/gbuilder-*-runner target/dist/gbuilder
          chmod +x target/dist/gbuilder

      - name: Stage native binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p target/dist
          cp target/gbuilder-*-runner.exe target/dist/gbuilder.exe

      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: gbuilder-native-${{ matrix.platform }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14
